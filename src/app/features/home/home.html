<div class="fixed inset-0 w-full h-full bg-gradient-to-br from-[#0a0f1d] via-[#0d1630] to-[#070b14] overflow-hidden z-0 pointer-events-none">
  <div class="stars"></div>
</div>

<div class="absolute top-0 left-0 w-full h-[400vh] overflow-hidden z-[1] pointer-events-none">
  
  <div class="absolute top-[5%] right-[-10%] w-[600px] h-[600px] bg-blue-600/15 rounded-full blur-[150px]"></div>
  <div class="absolute top-[25%] left-[-10%] w-[500px] h-[500px] bg-purple-600/10 rounded-full blur-[150px]"></div>
  <div class="absolute top-[50%] right-[10%] w-[600px] h-[600px] bg-cyan-600/10 rounded-full blur-[150px]"></div>
  <div class="absolute top-[75%] left-[20%] w-[500px] h-[500px] bg-blue-600/10 rounded-full blur-[150px]"></div>

  <div class="absolute inset-0 w-full h-full mix-blend-screen opacity-60">
    <svg viewBox="0 0 1440 4000" class="absolute w-full h-full object-cover" preserveAspectRatio="none">
      <defs>
        <filter id="galactic-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="60" />
        </filter>
        <filter id="star-glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur in="SourceGraphic" stdDeviation="15" />
        </filter>
        <linearGradient id="milky-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="rgba(30, 64, 175, 0)" />
          <stop offset="20%" stop-color="rgba(125, 211, 252, 0.4)" />
          <stop offset="40%" stop-color="rgba(192, 132, 252, 0.3)" />
          <stop offset="60%" stop-color="rgba(6, 182, 212, 0.4)" />
          <stop offset="80%" stop-color="rgba(168, 85, 247, 0.3)" />
          <stop offset="100%" stop-color="rgba(124, 58, 237, 0)" />
        </linearGradient>
      </defs>

      <path d="M -200 400 
               C 300 300, 600 800, 1000 1200 
               C 1400 1600, 800 2200, 400 2600
               C 0 3000, 600 3400, 1000 3800" 
            fill="none" stroke="url(#milky-gradient)" stroke-width="300" filter="url(#galactic-glow)" opacity="0.5" />
            
      <path d="M -200 400 
               C 300 300, 600 800, 1000 1200 
               C 1400 1600, 800 2200, 400 2600
               C 0 3000, 600 3400, 1000 3800" 
            fill="none" stroke="url(#milky-gradient)" stroke-width="150" filter="url(#star-glow)" opacity="0.8" />
            
      <path d="M -200 400 
               C 300 300, 600 800, 1000 1200 
               C 1400 1600, 800 2200, 400 2600
               C 0 3000, 600 3400, 1000 3800" 
            fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="3" filter="url(#star-glow)" />
    </svg>
  </div>
</div>

<div class="absolute inset-0 w-full h-full overflow-hidden z-[5] pointer-events-none">

  <div class="absolute top-[120vh] left-[-5%] w-64 h-64 rounded-full opacity-60 animate-float"
    style="background: radial-gradient(circle at 30% 30%, #38bdf8, #1e3a8a, #020617); box-shadow: 0 0 40px rgba(56,189,248,0.3);">
    <div
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[150%] h-[20px] rounded-[50%] border-t-2 border-b-2 border-cyan-300/30 transform rotate-[-20deg]">
    </div>
  </div>

  <div class="absolute top-[220vh] right-[10%] w-32 h-32 rounded-full opacity-50 animate-float"
    style="animation-delay: 2s; background: radial-gradient(circle at 70% 30%, #fb923c, #9a3412, #020617); box-shadow: 0 0 30px rgba(251,146,60,0.2);">
  </div>

  <div class="absolute top-[350vh] left-[20%] w-48 h-48 rounded-full opacity-40 animate-float"
    style="animation-delay: 1s; background: radial-gradient(circle at 40% 20%, #c084fc, #581c87, #020617); box-shadow: 0 0 50px rgba(192,132,252,0.2);">
  </div>
</div>

<main class="relative z-10 w-full min-h-screen">

  <section id="hero"
    class="container mx-auto px-6 py-24 md:py-32 min-h-[90vh] flex flex-col-reverse md:flex-row items-center justify-between gap-12 text-center md:text-left">
    <div class="md:w-[55%] lg:w-1/2">
      <h1 data-aos="fade-up" data-aos-delay="100"
        class="text-4xl md:text-5xl lg:text-6xl font-extrabold text-white leading-[1.2] mb-4">
        สวัสดีครับ,<br>ผม <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">{{
          personalInfo.name }}</span>
      </h1>
      <!-- <p data-aos="fade-up" data-aos-delay="200" class="text-xl md:text-2xl font-semibold text-blue-200 mb-4">
        {{ personalInfo.role }}
      </p> -->
      <p data-aos="fade-up" data-aos-delay="300"
        class="text-lg text-slate-400 mb-10 max-w-lg leading-relaxed md:mx-0 mx-auto">
        {{ personalInfo.description }}
      </p>
      <div data-aos="fade-up" data-aos-delay="400"
        class="flex flex-col sm:flex-row gap-4 justify-center md:justify-start">
        <a (click)="scrollToProjects($event)"
          class="inline-flex justify-center items-center gap-2 bg-blue-600 text-white px-8 py-3.5 rounded-xl font-bold hover:bg-blue-500 transition-all duration-300 shadow-lg shadow-blue-700/40 hover:-translate-y-1 cursor-pointer">
          ดูผลงานของผม
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd"
              d="M12.293 5.293a1 1 0 011.414 0l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414-1.414L14.586 11H3a1 1 0 110-2h11.586l-2.293-2.293a1 1 0 010-1.414z"
              clip-rule="evenodd" />
          </svg>
        </a>
        <a (click)="scrollToContact($event)"
          class="inline-flex justify-center items-center gap-2 bg-slate-800/50 text-white border border-slate-700 px-8 py-3.5 rounded-xl font-bold hover:bg-slate-800 hover:text-cyan-300 hover:border-cyan-700 transition-all duration-300 shadow-sm cursor-pointer backdrop-blur-sm">
          ติดต่อพูดคุย
        </a>
      </div>
    </div>

    <div class="md:w-[45%] lg:w-1/2 flex justify-center md:justify-center" data-aos="zoom-in" data-aos-delay="200">
      <div class="relative group cursor-default animate-float">
        <div
          class="absolute inset-[-20px] bg-gradient-to-r from-blue-600 via-cyan-400 to-purple-600 rounded-full blur-2xl opacity-40 group-hover:opacity-70 animate-spin-slow transition duration-700">
        </div>
        <div
          class="absolute inset-0 bg-blue-500 rounded-full blur-3xl opacity-20 group-hover:opacity-60 transition duration-500">
        </div>
        <div
          class="w-64 h-64 md:w-96 md:h-96 bg-black rounded-full border-slate-900/50 shadow-[0_0_50px_rgba(0,0,0,1)_inset] flex items-center justify-center text-slate-600 overflow-hidden relative z-10 transition-transform duration-700 group-hover:scale-[0.98]">
          <div class="absolute inset-0 rounded-full shadow-[inset_0_0_20px_rgba(34,211,238,0.5)]"></div>
          <img src="assets/images/profile.jpg" alt="Profile Picture" class="w-full h-full object-cover rounded-full">
        </div>
      </div>
    </div>
  </section>

  <section id="about" class="m-5" data-aos="fade-up">
    <app-about></app-about>
  </section>

  <section id="experience" data-aos="fade-up">
    <app-experience></app-experience>
  </section>

  <section id="projects" data-aos="fade-up">
    <app-project-all></app-project-all>
  </section>

</main>
