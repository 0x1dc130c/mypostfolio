<section id="experience" class="py-24 scroll-mt-24">
  <div class="container mx-auto px-6 max-w-4xl">
    
    <h2 class="text-3xl font-bold text-white mb-12 relative inline-block">
      ประสบการณ์ & การศึกษา
      <span class="absolute -bottom-2 left-0 w-12 h-1 bg-cyan-400 rounded-full shadow-[0_0_12px_rgba(34,211,238,0.6)]"></span>
    </h2>

    <div class="relative border-l-2 border-slate-700/60 ml-3 md:ml-0 mt-8">
      
      @for (exp of experiences; track exp.role) {
        <div class="mb-10 ml-8 group relative">
          
          <div class="absolute -left-[41px] top-6 w-4 h-4 bg-slate-800 rounded-full group-hover:bg-blue-500 transition-all duration-300 ring-4 ring-[#0a1128] group-hover:shadow-[0_0_15px_rgba(59,130,246,0.8)] z-10"></div>
          
          <div class="bg-slate-800/30 p-6 rounded-2xl border border-slate-700/50 shadow-lg hover:shadow-[0_8px_30px_rgba(0,0,0,0.3)] hover:border-slate-600/80 hover:-translate-y-1 transition-all duration-300 relative overflow-hidden backdrop-blur-sm">
            
            <div class="absolute left-0 top-0 bottom-0 w-1 bg-slate-700/50 group-hover:bg-blue-500 transition duration-300"></div>
            
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-4">
              <div>
                <h3 class="text-xl font-bold text-white tracking-wide">{{ exp.role }}</h3>
                <p class="text-cyan-400 font-medium text-sm mt-1 tracking-wider">{{ exp.company }}</p>
              </div>
              
              <div class="mt-3 md:mt-0">
                <span class="inline-block text-xs font-bold text-blue-200 bg-blue-900/20 border border-blue-800/40 px-3 py-1.5 rounded-full backdrop-blur-md">
                  {{ exp.period }}
                </span>
              </div>
            </div>
            
            <p class="text-slate-400 text-sm leading-relaxed mt-2">
              {{ exp.description.overview }}
            </p>
            
          </div>
        </div>
      }
      
    </div>
  </div>
</section>
